<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veille IA & Formation — ObsiaFormation</title>
<style>
:root{--blue:#2669df;--cyan:#35c2ed;--yellow:#fffdb9;--ink:#111827;--muted:#64748b;--card:#f4f8fc;--line:#dce7f3;--orange:#ff850b;--bg:#fff}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)} .shell{max-width:1180px;margin:auto}.hero{background:var(--yellow);padding:28px 30px;border-top:3px solid white}.hero h1{font-size:28px;margin:0 0 8px}.hero p{margin:0;max-width:850px;line-height:1.5}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;padding:24px;background:linear-gradient(90deg,var(--cyan) 0 18px,#fff 18px calc(100% - 18px),var(--cyan) calc(100% - 18px))}.sidebar{background:var(--yellow);border-radius:4px;padding:16px;height:max-content;position:sticky;top:16px}.sidebar h2{font-size:14px;margin:0 0 12px;text-transform:uppercase}.weeks button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px 6px;border-radius:6px;cursor:pointer;color:var(--blue)}.weeks button.active{background:var(--blue);color:#fff}.content{min-width:0}.edition-head{background:var(--blue);color:white;padding:22px 26px;margin:0 0 24px}.edition-head h2{margin:0 0 5px;font-size:24px}.edition-head p{margin:0;opacity:.95}.signals{background:var(--yellow);padding:18px 20px;margin-bottom:22px}.signals h3{margin-top:0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 11px;cursor:pointer}.chip.active{background:var(--blue);color:white;border-color:var(--blue)}.section-title{font-size:20px;margin:28px 0 12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border-left:4px solid var(--cyan);padding:16px;border-radius:5px}.card h4{margin:0 0 8px;font-size:17px;line-height:1.35}.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.badge{display:inline-block;background:#101010;color:#fff400;border-radius:4px;padding:3px 6px;font-size:11px}.card p{line-height:1.5;margin:8px 0 12px}.source-link{text-decoration:none;font-weight:bold}.empty{padding:30px;text-align:center;color:var(--muted)}
body.embed .hero{padding:18px 20px}body.embed .hero h1{font-size:21px}body.embed .layout{display:block;padding:14px;background:#fff}body.embed .sidebar{position:static;margin-bottom:14px}body.embed .weeks{display:flex;overflow:auto;gap:6px}body.embed .weeks button{width:auto;white-space:nowrap}body.embed .edition-head{padding:16px 18px}body.embed .cards{grid-template-columns:1fr}
@media(max-width:760px){.layout{display:block;padding:14px;background:white}.sidebar{position:static;margin-bottom:14px}.weeks{display:flex;overflow:auto;gap:6px}.weeks button{width:auto;white-space:nowrap}.cards{grid-template-columns:1fr}.hero{padding:20px}}
</style>
</head>
<body>
<div class="shell">
<header class="hero"><h1>🤖 Veille IA & Formation</h1><p>France & francophonie — sélection académique, institutionnelle et socio-économique, relue avant publication.</p></header>
<main class="layout">
<aside class="sidebar"><h2>Archives</h2><div id="weeks" class="weeks"></div></aside>
<section class="content">
<div id="edition"></div><div id="filters" class="chips"></div><div id="signals"></div><div id="items"></div>
</section>
</main>
</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycby3LBnwjaRp2xfBrV3S-MGjN_zqk2BZGS6LtivNMvXPDqVeDHvcJBWAw1D1NWFws7Kx/exec';
const p=new URLSearchParams(location.search); if(p.get('embed')==='1')document.body.classList.add('embed');
let data=null,currentWeek=p.get('week')||'',currentSection='Toutes';
const $=s=>document.querySelector(s);
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(week=''){
 const u=API_URL+(week?'?week='+encodeURIComponent(week):'');
 const r=await fetch(u); if(!r.ok)throw new Error('Erreur flux'); data=await r.json(); currentWeek=data.selected_edition?.week||''; render();
}
function render(){
 const ed=data.selected_edition;
 $('#weeks').innerHTML=(data.editions||[]).map(e=>`<button class="${e.week===currentWeek?'active':''}" onclick="pick('${esc(e.week)}')">${esc(e.week)} · ${esc(e.edition_date)}</button>`).join('');
 if(!ed){$('#edition').innerHTML='<div class="empty">Aucune édition publiée.</div>';return}
 $('#edition').innerHTML=`<div class="edition-head"><h2>${esc(ed.title)}</h2><p>${esc(ed.intro||'')}</p></div>`;
 const sections=['Toutes',...new Set((data.items||[]).map(x=>x.section))];
 $('#filters').innerHTML=sections.map(s=>`<button class="chip ${s===currentSection?'active':''}" onclick='filterSection(${JSON.stringify(s)})'>${esc(s)}</button>`).join('');
 $('#signals').innerHTML=(data.signals||[]).length?`<div class="signals"><h3>À retenir</h3>${data.signals.map(s=>`<p>• ${esc(s.signal)}</p>`).join('')}</div>`:'';
 const selected=(data.items||[]).filter(x=>currentSection==='Toutes'||x.section===currentSection);
 const grouped={}; selected.forEach(x=>(grouped[x.section]??=[]).push(x));
 $('#items').innerHTML=Object.entries(grouped).map(([section,items])=>`<h3 class="section-title">${esc(section)}</h3><div class="cards">${items.map(card).join('')}</div>`).join('')||'<div class="empty">Aucun item dans ce filtre.</div>';
}
function card(x){return `<article class="card"><h4>${esc(x.title)}</h4><div class="meta"><span>${esc(x.item_date)}</span><span>${esc(x.source)}</span><span class="badge">${esc(x.status)}</span></div><p>${esc(x.summary)}</p><a class="source-link" href="${esc(x.url)}" target="_blank" rel="noopener">Lire la source ↗</a></article>`}
function pick(w){currentSection='Toutes';history.replaceState(null,'','?week='+encodeURIComponent(w)+(document.body.classList.contains('embed')?'&embed=1':''));load(w)}
function filterSection(s){currentSection=s;render()}
load(currentWeek).catch(e=>{$('#items').innerHTML='<div class="empty">Impossible de charger la veille : '+esc(e.message)+'</div>'});
</script>
</body>
</html>
